{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    # MCP route — no auth (MCP server handles its own auth)
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/mcp`)
      services:
        - name: {{ .Release.Name }}-mcp
          port: {{ .Values.mcp.service.port }}
    # auth-token validates the Authentik RS256 token against the provider's
    # signing cert and injects X-User (the JWT sub).
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`)
      middlewares:
        # Strip must run before auth-token: the jwt plugin appends rather than
        # replaces, so a forged X-User would otherwise survive alongside it.
        - name: strip-identity-headers
          namespace: auth
        - name: auth-token
          namespace: auth
      services:
        - name: {{ .Release.Name }}
          port: {{ .Values.app.service.port }}
  tls:
    certResolver: letsencrypt
{{- end }}
