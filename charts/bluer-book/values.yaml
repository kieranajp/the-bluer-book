app:
  replicaCount: 1
  image:
    repository: ghcr.io/kieranajp/the-bluer-book
    tag: latest
  service:
    port: 8080
    type: ClusterIP
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17.5-alpine"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: local-path
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

ingress:
  enabled: true
  host: "recipes.kieranajp.uk"

mcp:
  service:
    port: 8082

monitoring:
  dashboard:
    # Ships the dashboard as a labelled ConfigMap; the Grafana sidecar
    # auto-provisions it, no homelab change needed.
    enabled: true

gemini:
  # Gemini model used by the chat handler and the tag-recipes job.
  model: "gemini-3.5-flash"

secretName: bluer-book-secrets

# Secret and config values live in a single 1Password item (Homelab vault),
# materialised into k8s Secret `secretName` by the onepassword-connect operator.
# Keys the item must hold; (!) means the pod never comes up without it:
#   DB_USER DB_PASS DB_NAME DB_HOST DB_PORT (!)  superuser; DB_PASS must match the postgres PVC
#   APP_DB_USER APP_DB_PASS (!)                  role the server connects as; no fallback to DB_USER
#   GOOGLE_API_KEY (!)                           tag-recipes init container and chat
#   R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_BUCKET R2_PUBLIC_URL (!)  fetch-images init container
#   R2_SECRET_ACCESS_KEY                         every photo upload fails without it
#   FOUNDER_SUBJECT                              missing at the founder's first login strands the existing recipes
# Optional: R2_JURISDICTION, MCP_HOME_ID (defaults to the founder home).
onepassword:
  vault: Homelab
  item: bluer-book-secrets
