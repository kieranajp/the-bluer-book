app:
  replicaCount: 1
  image:
    repository: ghcr.io/kieranajp/the-bluer-book
    tag: latest
  service:
    port: 8080
    type: ClusterIP
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17.5-alpine"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: local-path
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

ingress:
  enabled: true
  host: "recipes.kieranajp.uk"

mcp:
  service:
    port: 8082

monitoring:
  dashboard:
    # Ships the dashboard as a labelled ConfigMap; the Grafana sidecar
    # auto-provisions it, no homelab change needed.
    enabled: true

gemini:
  # Gemini model used by the chat handler and the tag-recipes job.
  model: "gemini-3.5-flash"

secretName: bluer-book-secrets

# Secret and config values live in a single 1Password item (Homelab vault),
# materialised into k8s Secret `secretName` by the onepassword-connect operator.

# APP_DB_USER has no fallback to DB_USER: DB_USER is the superuser, and the
# server refuses to start as it.
onepassword:
  vault: Homelab
  item: bluer-book-secrets
