app:
  replicaCount: 1
  image:
    repository: ghcr.io/kieranajp/the-bluer-book
    tag: latest
  service:
    port: 8080
    type: ClusterIP
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17.5-alpine"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: local-path
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

ingress:
  enabled: true
  host: "recipes.kieranajp.uk"

mcp:
  service:
    port: 8082

monitoring:
  dashboard:
    # Ships the Grafana dashboard (charts/bluer-book/dashboards/dashboard.json)
    # as a labelled ConfigMap. Grafana's sidecar auto-provisions it; no homelab
    # change needed.
    enabled: true

gemini:
  # Gemini model used by the chat handler and the tag-recipes job.
  model: "gemini-3.5-flash"

secretName: bluer-book-secrets

# All secret and config values live in a single 1Password item (Homelab vault).
# The onepassword-connect operator materialises a k8s Secret named `secretName`.
# Required keys: DB_USER, DB_PASS, DB_NAME, DB_HOST, DB_PORT, APP_DB_USER,
# APP_DB_PASS, GOOGLE_API_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_URL, FOUNDER_SUBJECT.
# Keep DB_PASS in sync with the existing postgres PVC (currently "xxx").
# APP_DB_USER is the role the server connects as — "bluer_book_app", which
# migration 00014 creates. DB_USER is the postgres superuser and so bypasses
# row-level security; the server refuses to start as a role that does. The
# migrate init container sets APP_DB_PASS on the role each run, so changing it
# here is enough. APP_DB_PASS is a fresh secret, unrelated to DB_PASS.
# FOUNDER_SUBJECT is the operator's token subject, read off a real access token.
# It decides who inherits the recipes that predate multitenancy, and it changes
# with the Authentik provider's sub mode.
onepassword:
  vault: Homelab
  item: bluer-book-secrets
